<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}My App{% endblock title %}
    </title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
    body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
    padding: 12px 20px;
}

.logo {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links li a {
    color: #fff;
    text-decoration: none;
    font-size: 16px;
}

.nav-links li a:hover {
    color: #00bcd4;
}

</style>

    {% block css %}
    <!-- Page specific CSS -->
    
    {% endblock css %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ===== NAVBAR START ===== -->
    <nav class="navbar">
    <div class="logo">MySite</div>
    <ul class="nav-links">
       <p style='color:white'>
    welcomr: {{data.name|default:'guest'}}
    </p>

    {% if not data %}
        <li><a href={% url 'login'  %}>Login</a></li>    
    {% else %}
        <li><a href={% url 'logout'  %}>Logout</a></li>
    {% endif %}

    </ul>
</nav>
    <!-- ===== NAVBAR END ===== -->

    <!-- ===== PAGE CONTENT ===== -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- ===== FOOTER START ===== -->
    <footer class="bg-light text-center py-3 mt-auto border-top">
        <div class="container">
            <small class="text-muted">
                © 2026 MyApp. All rights reserved.
            </small>
        </div>
    </footer>
    <!-- ===== FOOTER END ===== -->

    <!-- Bootstrap 5 JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
