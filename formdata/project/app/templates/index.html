<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <form action="{% url 'formdata' %}" method="post" enctype="multipart/form-data" class="border p-4 rounded shadow">
                {% csrf_token %}

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <!-- Contact -->
                 
                <div class="mb-3">
                    <label class="form-label">Contact 2</label>
                    <input type="tel" name="contact" class="form-control" required>
                </div>

                <!-- Qualification -->
                <div class="mb-3">
                    <label class="form-label">Qualification</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="education" value="10">
                        <label class="form-check-label">10</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="education" value="12">
                        <label class="form-check-label">12</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="education" value="ug">
                        <label class="form-check-label">UG</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="education" value="pg">
                        <label class="form-check-label">PG</label>
                    </div>
                </div>

                <!-- State -->
                <div class="mb-3">
                    <label class="form-label">State</label>
                    <select name="city" class="form-select">
                        <option value="">Select your state</option>
                        <option value="MP">M.P</option>
                        <option value="UP">U.P</option>
                        <option value="CG">C.G</option>
                    </select>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Male">
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Female">
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Other">
                        <label class="form-check-label">Other</label>
                    </div>
                </div>

                <!-- Files -->
                <div class="mb-3">
                    <label class="form-label">Photo</label>
                    <input type="file" name="image" class="form-control" accept=".jpeg,.png">
                </div>

                <div class="mb-3">
                    <label class="form-label">Document</label>
                    <input type="file" name="document" class="form-control" accept=".pdf,.doc,.csv">
                </div>

                <div class="mb-3">
                    <label class="form-label">Audio</label>
                    <input type="file" name="audio" class="form-control" accept=".mp3">
                </div>

                <div class="mb-3">
                    <label class="form-label">Video</label>
                    <input type="file" name="video" class="form-control" accept=".mp4">
                </div>

                <!-- Submit -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
